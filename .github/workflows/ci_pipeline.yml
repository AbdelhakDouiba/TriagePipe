name: TriagePipe CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Bandit SAST scan
        id: bandit
        run: |
          bandit -r . -f json -o bandit_results.json || true
          echo "bandit_output=bandit_results.json" >> $GITHUB_OUTPUT

      - name: Run pip-audit SCA scan
        id: sca
        run: |
          pip-audit --format json -o pip_audit_results.json . 2>/dev/null || echo '{"results":[]}' > pip_audit_results.json
          echo "sca_output=pip_audit_results.json" >> $GITHUB_OUTPUT

      - name: Run GitLeaks secret detection
        id: secrets
        run: |
          gitleaks protect --verbose --no-git --report-format json --report-path gitleaks_results.json 2>/dev/null || true
          if [ ! -f gitleaks_results.json ]; then
            echo '{"findings":[]}' > gitleaks_results.json
          fi
          echo "secrets_output=gitleaks_results.json" >> $GITHUB_OUTPUT

      - name: Run Triage Engine
        id: triage
        run: |
          python -m triage . bandit_results.json 2>/dev/null || true
          echo "triage_run=true" >> $GITHUB_OUTPUT

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit_results.json

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: pip_audit_results.json

      - name: Upload GitLeaks results
        uses: actions/upload-artifact@v4
        with:
          name: secrets-results
          path: gitleaks_results.json

      - name: Generate triage summary
        run: |
          echo "=== Security Scan Summary ==="
          echo "Bandit alerts: $(python -c "import json; d=json.load(open('bandit_results.json')); print(len(d.get('results',[])))")"
          echo "pip-audit vulnerabilities: $(python -c "import json; d=json.load(open('pip_audit_results.json')); print(len(d.get('results',[])))")"
          echo "GitLeaks secrets: $(python -c "import json; d=json.load(open('gitleaks_results.json')); print(len(d.get('findings',[])))")"